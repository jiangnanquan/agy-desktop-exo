<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context Usage</title>
<script src="/preload.js"></script>
<style>
  :root {
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
    --fg: var(--foreground, #e3e3e3);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .22));
    --empty: color-mix(in srgb, var(--dim) 28%, transparent);
    --surface: color-mix(in srgb, var(--fg) 4%, transparent);
    --surface-hover: color-mix(in srgb, var(--fg) 7%, transparent);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 30%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  main { padding: 12px 14px 18px; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .model { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: #81c995; }
  .usage { margin: 2px 0 12px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .usage .big { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .usage .of { color: var(--dim); }
  .usage .pct { margin-left: auto; font-size: 13px; font-weight: 600; }
  button {
    font: inherit; font-size: 11.5px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2.5px 8px;
    transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  button:hover { color: var(--fg); border-color: var(--dim); background: var(--surface); }

  /* grid: each dot is 1% of the context window */
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 320px; margin-bottom: 4px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: var(--empty); }

  /* sections */
  section { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .note { font-size: 12px; color: var(--dim); margin: -2px 0 8px; }
  .group + .group { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 8px; padding: 2.5px 0; }
  .row .tok { text-align: right; }
  .row .p { text-align: right; color: var(--dim); font-size: 12px; }
  .mark { width: 8px; height: 8px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  /* context growth curve */
  .curve-card {
    border-radius: 8px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
    padding: 10px 10px 8px;
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .curve-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    color: var(--dim);
    gap: 8px;
    flex-wrap: wrap;
  }
  .curve-title {
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .curve-badge {
    font-size: 10px;
    font-weight: 500;
    padding: 0 5px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--c-agent) 12%, transparent);
    color: var(--c-agent);
    border: 1px solid color-mix(in srgb, var(--c-agent) 30%, transparent);
    text-transform: none;
    letter-spacing: 0;
  }
  .curve-info {
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--dim);
  }
  .curve-info strong {
    color: var(--fg);
    font-weight: 600;
  }
  .curve-chart-wrap {
    position: relative;
    width: 100%;
    user-select: none;
    touch-action: none;
  }
  .curve-svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  .curve-tooltip {
    min-height: 24px;
    font-size: 11px;
    line-height: 1.35;
    padding: 4px 8px;
    border-radius: 6px;
    background: color-mix(in srgb, var(--fg) 3%, transparent);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    overflow: hidden;
  }
  .curve-tooltip-main {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .curve-tooltip-preview {
    color: var(--dim);
    font-size: 10.5px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .curve-legend {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--dim);
    padding: 6px 4px 2px;
    border-top: 1px solid var(--line);
    margin-top: 2px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .curve-legend-items {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .curve-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--fg);
    opacity: 0.9;
    white-space: nowrap;
  }

  /* interactive per-turn inspector (DeepSeek Harness style) */
  .turn-list { display: flex; flex-direction: column; gap: 2px; }
  details.turn-item {
    border-radius: 7px;
    border: 1px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  details.turn-item:hover {
    background: var(--surface);
  }
  details.turn-item[open] {
    background: var(--surface);
    border-color: var(--line);
    margin: 2px 0;
  }
  summary.turn-summary {
    list-style: none;
    display: grid;
    grid-template-columns: 12px 36px 1fr 68px 46px 54px;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
  }
  summary.turn-summary::-webkit-details-marker { display: none; }
  .turn-chev {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    opacity: 0.65;
    transition: transform 0.14s ease;
  }
  details.turn-item[open] .turn-chev {
    transform: rotate(90deg);
    color: var(--fg);
    opacity: 0.9;
  }
  .turn-main {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .turn-tag {
    font-size: 10px;
    line-height: 1.3;
    padding: 0 5px;
    border-radius: 4px;
    color: var(--dim);
    border: 1px solid var(--line);
    flex: none;
  }
  .turn-tag.user {
    color: var(--c-user);
    border-color: color-mix(in srgb, var(--c-user) 35%, transparent);
  }
  .turn-tag.bust {
    color: #f87171;
    background: color-mix(in srgb, #ef4444 13%, transparent);
    border-color: color-mix(in srgb, #ef4444 42%, transparent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* dual-mode top switch bar & right-hand language / refresh controls */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 11px;
  }
  .mode-tabs {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    padding: 3px;
    border-radius: 8px;
    background: color-mix(in srgb, var(--fg) 4.5%, transparent);
    border: 1px solid var(--line);
  }
  .nav-tools {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex: none;
  }
  .lang-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    height: 31px;
    padding: 0 7.5px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 3.5%, transparent);
    color: var(--dim);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
  }
  .lang-pill:hover {
    border-color: var(--dim);
    background: var(--surface-hover);
  }
  .lang-pill .on {
    color: var(--fg);
    font-weight: 600;
  }
  .lang-pill .sep {
    opacity: 0.42;
    font-size: 10px;
  }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 31px;
    height: 31px;
    padding: 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 3.5%, transparent);
    color: var(--dim);
  }
  .icon-btn:hover {
    color: var(--fg);
    border-color: var(--dim);
    background: var(--surface-hover);
  }
  .mode-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 25px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--dim);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .mode-tab:hover {
    color: var(--fg);
    background: color-mix(in srgb, var(--fg) 4%, transparent);
    border-color: transparent;
  }
  .mode-tab.active {
    color: var(--fg);
    font-weight: 600;
    background: color-mix(in srgb, var(--fg) 9%, transparent);
    border-color: var(--line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .tab-count {
    font-size: 10px;
    padding: 0 5px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--c-agent) 16%, transparent);
    color: var(--c-agent);
    border: 1px solid color-mix(in srgb, var(--c-agent) 32%, transparent);
  }
  .tab-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    animation: pulse-dot 1.8s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.42; transform: scale(0.84); }
  }

  /* single-session live TTL & cache bust capsules */
  .cache-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin: -4px 0 10px;
  }
  .ttl-pill, .bust-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 7.5px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 3%, transparent);
    white-space: nowrap;
  }
  .ttl-pill .ttl-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    flex: none;
  }
  .ttl-pill.warm {
    color: #10b981;
    border-color: color-mix(in srgb, #10b981 36%, transparent);
    background: color-mix(in srgb, #10b981 8%, transparent);
  }
  .ttl-pill.warm .ttl-dot { background: #10b981; }
  .ttl-pill.risk {
    color: #f59e0b;
    border-color: color-mix(in srgb, #f59e0b 45%, transparent);
    background: color-mix(in srgb, #f59e0b 10%, transparent);
  }
  .ttl-pill.risk .ttl-dot {
    background: #f59e0b;
    animation: pulse-dot 1.2s ease-in-out infinite;
  }
  .ttl-pill.cold {
    color: color-mix(in srgb, #f87171 80%, var(--dim));
    border-color: color-mix(in srgb, #f87171 28%, var(--line));
    background: color-mix(in srgb, #f87171 6%, transparent);
  }
  .ttl-pill.cold .ttl-dot { background: color-mix(in srgb, #f87171 75%, var(--dim)); }
  .ttl-pill.killed {
    color: var(--dim);
    opacity: 0.72;
  }
  .bust-pill.has-bust {
    color: #f59e0b;
    border-color: color-mix(in srgb, #f59e0b 40%, transparent);
    background: color-mix(in srgb, #f59e0b 8%, transparent);
  }
  .bust-pill.severe {
    color: #f87171;
    border-color: color-mix(in srgb, #ef4444 42%, transparent);
    background: color-mix(in srgb, #ef4444 9%, transparent);
  }

  /* Swarm Radar view */
  .swarm-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
  }
  .swarm-title-wrap { min-width: 0; }
  .swarm-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
  }
  .swarm-sub {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 3px;
    font-size: 11px;
    color: var(--dim);
  }
  .mini-pill {
    font-size: 10px;
    padding: 0 5.5px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--dim);
    white-space: nowrap;
  }
  .mini-pill.info {
    color: var(--c-agent);
    border-color: color-mix(in srgb, var(--c-agent) 35%, transparent);
    background: color-mix(in srgb, var(--c-agent) 8%, transparent);
  }
  .mini-pill.warn {
    color: #f59e0b;
    border-color: color-mix(in srgb, #f59e0b 40%, transparent);
    background: color-mix(in srgb, #f59e0b 9%, transparent);
  }
  .mini-pill.bad {
    color: #f87171;
    border-color: color-mix(in srgb, #ef4444 42%, transparent);
    background: color-mix(in srgb, #ef4444 10%, transparent);
  }
  .mini-pill.ok {
    color: #10b981;
    border-color: color-mix(in srgb, #10b981 36%, transparent);
    background: color-mix(in srgb, #10b981 7%, transparent);
  }

  .swarm-kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 10px;
  }
  .kpi-card {
    padding: 8px 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2.5%, transparent);
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .kpi-card.alert {
    border-color: color-mix(in srgb, #f59e0b 40%, var(--line));
    background: color-mix(in srgb, #f59e0b 5%, transparent);
  }
  .kpi-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .kpi-val {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .kpi-foot {
    font-size: 10.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .ttl-legend-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
    padding: 6px 8px;
    margin-bottom: 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
    font-size: 10.5px;
    color: var(--dim);
  }
  .ttl-leg-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .ttl-leg-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex: none;
  }

  .worker-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .worker-card {
    padding: 8px 9px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2.2%, transparent);
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  .worker-card.viewed {
    border-color: color-mix(in srgb, var(--c-agent) 45%, var(--line));
    background: color-mix(in srgb, var(--c-agent) 4%, transparent);
  }
  .worker-card.killed {
    opacity: 0.66;
  }
  .wk-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .wk-id {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
  }
  .wk-name {
    font-weight: 600;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .st-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
    background: var(--dim);
  }
  .st-dot.working {
    background: #10b981;
    box-shadow: 0 0 0 2px color-mix(in srgb, #10b981 24%, transparent);
    animation: pulse-dot 1.4s ease-in-out infinite;
  }
  .st-dot.waiting {
    background: #f59e0b;
  }
  .st-dot.idle {
    background: #4c8df6;
  }
  .st-dot.killed {
    background: var(--dim);
    opacity: 0.5;
  }
  .wk-mid {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 11px;
  }
  .wk-model {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    max-width: 100%;
  }
  .wk-model-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px;
    color: var(--dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }
  .ctx-bar-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 8px;
  }
  .ctx-bar-track {
    height: 4px;
    border-radius: 999px;
    background: var(--empty);
    overflow: hidden;
  }
  .ctx-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.2s ease;
  }
  .wk-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }

  .turn-detail {
    border-top: 1px solid var(--line);
    padding: 9px 10px 10px;
    font-size: 11.5px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .td-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--dim);
    flex-wrap: wrap;
  }
  .td-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  @media (max-width: 340px) {
    .td-cards { grid-template-columns: 1fr; }
  }
  .td-card {
    padding: 7px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
    display: flex;
    flex-direction: column;
    gap: 3.5px;
  }
  .td-card-title {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--dim);
    margin-bottom: 1px;
  }
  .td-bar {
    height: 3px;
    border-radius: 999px;
    background: var(--empty);
    overflow: hidden;
    display: flex;
    margin-bottom: 3px;
  }
  .td-kv {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
  }
  .td-kv .k { color: var(--dim); }
  .td-kv .v { font-variant-numeric: tabular-nums; font-weight: 500; }

  .td-box {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--fg) 2%, transparent);

    }

  function normalizeLangSetting(raw) {
    const v = String(raw || '').trim().toLowerCase();
    if (v.startsWith('zh')) return 'zh';
    if (v.startsWith('en')) return 'en';
    return 'auto';
  }

  function detectParentOrNavigatorLang() {
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        const exo = window.parent.document.documentElement?.dataset?.agExoLang;
        if (exo === 'zh' || exo === 'en') return exo;
      }
    } catch {}
    if (hostDetectedLang === 'zh' || hostDetectedLang === 'en') {
      return hostDetectedLang;
    }
    const nav = (typeof navigator !== 'undefined' && navigator.language) || '';
    return /^zh\b/i.test(String(nav).trim()) ? 'zh' : 'en';
  }

  function resolveUiLang() {
    if (configLang === 'zh' || configLang === 'en') return configLang;
    return detectParentOrNavigatorLang();
  }

  function t(key, vars) {
    const lang = resolveUiLang();
    const dict = I18N[lang] || I18N.en;
    let str = dict[key] !== undefined ? dict[key] : (I18N.en[key] || key);
    if (vars && typeof vars === 'object') {
      for (const [k, v] of Object.entries(vars)) {
        str = str.split(`{${k}}`).join(String(v ?? ''));
      }
    }
    return str;
  }

  function syncDocumentLangMeta() {
    const lang = resolveUiLang();
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = t('doc_title');
  }

  async function toggleUiLanguage() {
    const nextLang = resolveUiLang() === 'zh' ? 'en' : 'zh';
    configLang = nextLang;
    userOverrodeLangUntil = Date.now() + 5000;
    syncDocumentLangMeta();
    lastJson = '';
    if (lastReportPayload !== null || swarmData !== null) {
      render(lastReportPayload, swarmData);
    }
    try {
      window.parent?.postMessage({ type: 'agy-context-lang-changed', lang: nextLang }, '*');
    } catch {}
    try {
      const body = JSON.stringify({ lang: nextLang });
      const opts = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
      await doFetch(`/api/config?lang=${encodeURIComponent(nextLang)}`, opts).catch(() =>
        doFetch(`/config?lang=${encodeURIComponent(nextLang)}`, opts)
      );
    } catch {}
    lastJson = '';
    refresh(true);
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function fmtTok(n) {
    const val = Number(n) || 0;
    if (val >= 1e6) { const v = val / 1e6; return Number.isInteger(v) ? `${v}M` : `${v.toFixed(1)}M`; }
    if (val >= 1e3) return `${(val / 1e3).toFixed(1)}k`;
    return String(val);
  }

  function fmtClock(sec) {
    const s = Math.max(0, Math.floor(Number(sec) || 0));
    if (s >= 3600) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return `${h}h${String(m).padStart(2, '0')}m`;
    }
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
  }

  function fmtOverheadDur(sec) {
    if (sec === null || sec === undefined || Number.isNaN(Number(sec))) return '--';
    const s = Math.max(0, Math.round(Number(sec)));
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s`;
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return `${h}h${String(m).padStart(2, '0')}m`;
  }

  function evalTtlState(isoStr, mode) {
    if (!isoStr) return { cls: '', label: t('ttl_awaiting'), title: t('ttl_awaiting_tip') };
    const ts = Date.parse(isoStr);
    if (!Number.isFinite(ts)) return { cls: '', label: '--:--', title: '' };
    const idleSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    const clk = fmtClock(idleSec);
    if (idleSec < 180) {
      const rem = 180 - idleSec;
      return {
        cls: 'warm',
        label: mode === 'worker' ? t('ttl_warm_worker', { t: clk }) : t('ttl_warm_single', { t: clk }),
        title: t('ttl_warm_tip', { rem: fmtClock(rem) })
      };
    }
    if (idleSec < 300) {
      return {
        cls: 'risk',
        label: t('ttl_risk', { t: clk }),
        title: t('ttl_risk_tip', { t: clk })
      };
    }
    return {
      cls: 'cold',
      label: mode === 'worker' ? t('ttl_cold_worker', { t: clk }) : t('ttl_cold_single', { t: clk }),
      title: t('ttl_cold_tip', { t: clk })
    };
  }

  function tickAllTtlCapsules() {
    document.querySelectorAll('[data-ttl-ts]').forEach((el) => {
      const ts = el.getAttribute('data-ttl-ts') || '';
      const mode = el.getAttribute('data-ttl-mode') || 'single';
      const st = evalTtlState(ts, mode);
      el.classList.remove('warm', 'risk', 'cold');
      if (st.cls) el.classList.add(st.cls);
      if (st.title) el.title = st.title;
      const txtEl = el.querySelector('.ttl-txt');
      if (txtEl) txtEl.textContent = st.label;
    });
  }

  function setMode(nextMode, manual = true) {
    if (nextMode !== 'single' && nextMode !== 'swarm') return;
    activeMode = nextMode;
    if (manual) {
      userPinnedMode = true;
      try { localStorage.setItem(TAB_PREF_KEY, nextMode); } catch {}
    }
    lastJson = '';
    refresh(true);
  }

  window.addEventListener('message', (ev) => {
    const d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    if (d.hostLang === 'zh' || d.hostLang === 'en') {
      const prevUi = resolveUiLang();
      hostDetectedLang = d.hostLang;
      if (d.configLang && Date.now() >= userOverrodeLangUntil) {
        configLang = normalizeLangSetting(d.configLang);
      }
      if (resolveUiLang() !== prevUi && (lastReportPayload !== null || swarmData !== null)) {
        syncDocumentLangMeta();
        lastJson = '';
        render(lastReportPayload, swarmData);
      }
    }
    if (d.type === 'agy-context-switch-tab' && (d.tab === 'swarm' || d.tab === 'single')) {
      setMode(d.tab, true);
    }
  });

  function gridCells(segments, limit, total) {
    let counts = segments.map((tok) => (!tok || !limit ? 0 : Math.max(1, Math.floor(tok / limit * total))));
    const used = counts.reduce((a, b) => a + b, 0);
    if (used > total) counts = counts.map((c) => Math.floor(c * total / used));
    return [...counts, total - counts.reduce((a, b) => a + b, 0)];
  }

  const HEADING_KEY_MAP = {
    'Estimated after compaction · updates next turn': 'heading_compacted',
    'Token usage by category': 'heading_by_cat',
    'Estimated usage (awaiting generation)': 'heading_awaiting'
  };

  function effectiveLimit(r) {
    const b = Number(r && r.request_budget_tokens) || 0;
    const n = Number(r && r.limit_tokens) || 0;
    return b > 0 ? b : n;
  }

  function grid(r) {
    const effLim = effectiveLimit(r);
    const counts = gridCells(r.grid_segments, effLim, 100);
    let dots = '';
    counts.forEach((n, i) => {
      dots += (i === 5 ? '<span class="dot"></span>' : `<span class="dot" style="background:${SEGMENT_COLORS[i]}"></span>`).repeat(n);
    });
    return `<div class="grid" title="${esc(t('grid_tip', { lim: fmtTok(effLim) }))}">${dots}</div>`;
  }

  function categoryRow(c, effLim) {
    const color = CONVERSATION[c.key] || (SYSTEM.has(c.key) ? 'var(--c-system)' : 'var(--c-custom)');
    const shape = CONVERSATION[c.key] ? '' : ' sq';
    const catKey = `cat_${c.key}`;
    const label = I18N.en[catKey] ? t(catKey) : c.name;
    const pVal = effLim > 0 ? Math.min(100, (Number(c.tokens) || 0) / effLim * 100) : (c.pct || 0);
    return `<div class="row"><span class="mark${shape}" style="background:${color}"></span><span>${esc(label)}</span>`
      + `<span class="tok num">${fmtTok(c.tokens)}</span><span class="p num">${pVal.toFixed(1)}%</span></div>`;
  }

  function categories(r) {
    const conv = r.categories.filter((c) => CONVERSATION[c.key]);
    const rest = r.categories.filter((c) => !CONVERSATION[c.key]);
    const effLim = effectiveLimit(r);
    const used = Number(r.used_tokens) || 0;
    const effFree = effLim > used ? effLim - used : 0;
    const freePct = effLim ? (effFree / effLim * 100).toFixed(1) : '0.0';
    const free = `<div class="row"><span class="mark free"></span><span class="dim">${esc(t('free_until_compact'))}</span>`
      + `<span class="tok num">${fmtTok(effFree)}</span><span class="p num">${freePct}%</span></div>`;
    const hKey = HEADING_KEY_MAP[r.heading];
    const noteText = hKey ? t(hKey) : r.heading;
    const note = r.heading === 'Token usage by category' ? '' : `<p class="note">${esc(noteText)}</p>`;
    const buffer = r.checkpoint_buffer
      ? `<p class="note">${esc(t('ck_buffer', { tok: fmtTok(r.checkpoint_buffer) }))}</p>` : '';
    return `<section><h2>${esc(t('sec_categories'))}</h2>${note}
      <div class="group">${conv.map((c) => categoryRow(c, effLim)).join('')}</div>
      ${rest.length ? `<div class="group">${rest.map((c) => categoryRow(c, effLim)).join('')}</div>` : ''}
      <div class="group">${free}</div>${buffer}</section>`;
  }

  function checkpoints(r) {
    const ck = r.checkpoint_view;
    if (!ck) return '';
    const older = ck.historical ? `<div class="dim" style="font-size:12px">${esc(t('ck_older', { n: ck.historical }))}</div>` : '';
    return `<section><h2>${esc(t('sec_checkpoints'))} <span class="hint">${esc(t('ck_hint', { n: ck.count }))}</span></h2>
      <div class="ck-main"><span>${esc(t('ck_item', { num: ck.active_number, txt: ck.active_text }))}</span><span class="badge">${esc(t('ck_badge'))}</span></div>${older}</section>`;
  }

  function splitPath(path, activeConvId) {
    const trimmed = path.replace(/\/$/, '');
    const i = trimmed.lastIndexOf('/');
    const name = trimmed.slice(i + 1) + (path.endsWith('/') ? '/' : '');
    let dir = i > 0 ? trimmed.slice(0, i) : '';
    const cid = activeConvId || initialConversationId;
    if (cid) dir = dir.replace(new RegExp(`^.*/brain/${cid}`), t('conv_folder'));
    return { name, dir };
  }

  function files(title, hint, items, activeConvId) {
    if (!items || !items.length) return '';
    const rows = items.map((f) => {
      const { name, dir } = splitPath(f.path, activeConvId);
      return `<li title="${esc(f.path)}"><span class="name">${esc(name)}<span class="dir">‎${esc(dir)}</span></span>`
        + `<span class="tok num">${f.tokens > 0 ? fmtTok(f.tokens) : ''}</span></li>`;
    }).join('');
    return `<section><h2>${esc(title)} <span class="hint">${esc(hint)}</span></h2><ul class="files">${rows}</ul></section>`;
  }

  function fmtSec(ms) {
    if (!ms || ms <= 0) return '0.00s';
    if (ms < 1000) return `${ms}ms`;
    return `${(ms / 1000).toFixed(2)}s`;
  }

  function makeSmoothPath(pts) {
    if (!pts || !pts.length) return '';
    if (pts.length === 1) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    if (pts.length === 2) return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)} L ${pts[1].x.toFixed(1)} ${pts[1].y.toFixed(1)}`;
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i === 0 ? i : i - 1];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    return d;
  }

  function calculateYScale(maxVal) {
    const target = Math.max(100, maxVal * 1.08);
    const roughStep = target / 3;
    const pow = Math.pow(10, Math.max(0, Math.floor(Math.log10(roughStep))));
    const frac = roughStep / pow;
    let step;
    if (frac <= 1.5) step = 1 * pow;
    else if (frac <= 3.5) step = 2 * pow;
    else if (frac <= 7.5) step = 5 * pow;
    else step = 10 * pow;
    const yMax = Math.ceil(target / step) * step;
    const ticks = [];
    for (let v = 0; v <= yMax; v += step) {
      ticks.push(v);
    }
    return { yMax, ticks };
  }

  function growthCurveSection(r) {
    const tel = r.telemetry;
    if (!tel || !Array.isArray(tel.turns_curve) || !tel.turns_curve.length) return '';
    const curve = tel.turns_curve;
    const N = curve.length;
    const pStart = curve[0];
    const pLatest = curve[N - 1];
    const growth = (pLatest.prompt_tokens || 0) - (pStart.prompt_tokens || 0);
    const netStr = `${growth >= 0 ? '+' : ''}${fmtTok(growth)}`;

    const maxTok = Math.max(...curve.map((c) => c.prompt_tokens || 0), 100);
    const { yMax, ticks } = calculateYScale(maxTok);

    const svgW = 340;
    const svgH = 150;
    const padL = 46;
    const padR = 14;
    const padT = 18;
    const padB = 26;
    const plotW = svgW - padL - padR;
    const plotH = svgH - padT - padB;
    const plotBottom = padT + plotH;
    const plotRight = padL + plotW;

    const pts = curve.map((turn, i) => {
      const x = N > 1 ? padL + (i / (N - 1)) * plotW : padL + plotW / 2;
      const y = plotBottom - Math.min(plotH, Math.max(0, ((turn.prompt_tokens || 0) / yMax) * plotH));
      return { x, y, turn, i };
    });

    const gridLinesHtml = ticks.map((v) => {
      const y = plotBottom - (v / yMax) * plotH;
      return `
        <line x1="${padL}" y1="${y.toFixed(1)}" x2="${plotRight}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="3,3" opacity="0.6"/>
        <text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" fill="var(--dim)" font-size="9" class="num">${fmtTok(v)}</text>
      `;
    }).join('');

    const axisBottomHtml = `<line x1="${padL}" y1="${plotBottom}" x2="${plotRight}" y2="${plotBottom}" stroke="var(--line)"/>`;

    let xTickIndices = [];
    if (N <= 6) {
      xTickIndices = curve.map((_, idx) => idx);
    } else {
      xTickIndices = [0, Math.floor(N * 0.25), Math.floor(N * 0.5), Math.floor(N * 0.75), N - 1];
      xTickIndices = [...new Set(xTickIndices)];
    }
    const xTicksHtml = xTickIndices.map((idx) => {
      const pt = pts[idx];
      return `
        <line x1="${pt.x.toFixed(1)}" y1="${plotBottom}" x2="${pt.x.toFixed(1)}" y2="${plotBottom + 3}" stroke="var(--line)"/>
        <text x="${pt.x.toFixed(1)}" y="${plotBottom + 13}" text-anchor="middle" fill="var(--dim)" font-size="9" class="num">#${pt.turn.step}</text>
      `;
    }).join('');

    let pathHtml = '';
    if (N === 1) {
      pathHtml = `
        <line x1="${padL}" y1="${pts[0].y.toFixed(1)}" x2="${plotRight}" y2="${pts[0].y.toFixed(1)}" stroke="var(--c-agent)" stroke-width="1.8" stroke-dasharray="4,4"/>
        <circle cx="${pts[0].x.toFixed(1)}" cy="${pts[0].y.toFixed(1)}" r="4" fill="var(--c-agent)" stroke="var(--surface)" stroke-width="1.5"/>
      `;
    } else {
      const lineD = makeSmoothPath(pts);
      const areaD = `${lineD} L ${pts[N - 1].x.toFixed(1)} ${plotBottom} L ${pts[0].x.toFixed(1)} ${plotBottom} Z`;
      pathHtml = `
        <path d="${areaD}" fill="url(#growth-area-grad)"/>
        <path d="${lineD}" fill="none" stroke="var(--c-agent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      `;
    }

    const dotsHtml = pts.map((pt) => {
      const isBust = Boolean(pt.turn.cache_bust);
      const isUser = Boolean(pt.turn.user_prompt);
      const isDrop = pt.turn.context_delta < 0;
      if (N > 32 && !isBust && !isUser && !isDrop && pt.i !== 0 && pt.i !== N - 1) {
        return '';
      }
      const rad = isBust ? 3.8 : (isUser ? 3.5 : (isDrop ? 3.2 : 2.2));
      const color = isBust ? '#ef4444' : (isDrop ? '#81c995' : (isUser ? 'var(--c-user)' : 'var(--c-agent)'));
      return `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${rad}" fill="${color}" stroke="var(--surface)" stroke-width="1.2"/>`;
    }).join('');

    const hasDrops = pts.some((p) => p.turn.context_delta < 0);
    const hasBusts = pts.some((p) => p.turn.cache_bust);
    const budget = Number(r.request_budget_tokens) || 0;
    let budgetLineHtml = '';
    let budgetLegendHtml = '';
    if (budget > 0 && budget <= yMax) {
      const budgetY = plotBottom - (budget / yMax) * plotH;
      budgetLineHtml = `
        <line x1="${padL}" y1="${budgetY.toFixed(1)}" x2="${plotRight}" y2="${budgetY.toFixed(1)}" stroke="#f28b82" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.85"/>
        <text x="${plotRight}" y="${(budgetY - 3).toFixed(1)}" text-anchor="end" fill="#f28b82" font-size="8.5" font-weight="500">${esc(t('curve_budget_line', { tok: fmtTok(budget) }))}</text>
      `;
      budgetLegendHtml = `
        <span class="curve-legend-item">
          <svg width="16" height="8" viewBox="0 0 16 8" style="flex:none;">
            <line x1="0" y1="4" x2="16" y2="4" stroke="#f28b82" stroke-width="1.6" stroke-dasharray="3,2"/>
          </svg>
          <span>${esc(t('curve_budget_leg', { tok: fmtTok(budget) }))}</span>
        </span>
      `;
    } else if (budget > 0) {
      budgetLegendHtml = `<span class="dim num">${esc(t('curve_budget_out', { tok: fmtTok(budget) }))}</span>`;
    }

    return `
      <section>
        <h2>
          <span>${esc(t('sec_curve'))}</span>
          <span class="hint num">${esc(t('curve_turns', { n: N }))}</span>
        </h2>
        <div class="curve-card">
          <div class="curve-header">
            <div class="curve-title">
              <span class="curve-badge num">#${pStart.step} → #${pLatest.step}</span>
            </div>
            <div class="curve-info">
              ${esc(t('curve_start'))}<strong>${fmtTok(pStart.prompt_tokens)}</strong> · ${esc(t('curve_latest'))}<strong>${fmtTok(pLatest.prompt_tokens)}</strong>
              <span class="dim">(${netStr})</span>
            </div>
          </div>
          <div class="curve-chart-wrap" id="curve-wrap">
            <svg class="curve-svg" viewBox="0 0 ${svgW} ${svgH}" role="img" aria-label="${esc(t('curve_aria'))}">
              <defs>
                <linearGradient id="growth-area-grad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="var(--c-agent)" stop-opacity="0.32"/>
                  <stop offset="75%" stop-color="var(--c-agent)" stop-opacity="0.06"/>
                  <stop offset="100%" stop-color="var(--c-agent)" stop-opacity="0"/>
                </linearGradient>
              </defs>
              ${gridLinesHtml}
              ${budgetLineHtml}
              ${axisBottomHtml}
              ${xTicksHtml}
              <text x="${padL}" y="11" fill="var(--dim)" font-size="9.5" font-weight="500">${esc(t('curve_axis_y'))}</text>
              <text x="${plotRight}" y="146" text-anchor="end" fill="var(--dim)" font-size="9.5" font-weight="500">${esc(t('curve_axis_x'))}</text>
              ${pathHtml}
              ${dotsHtml}
              <line id="curve-crosshair" x1="0" y1="${padT}" x2="0" y2="${plotBottom}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2,2" opacity="0" pointer-events="none"/>
              <circle id="curve-hover-dot" cx="0" cy="0" r="4.5" fill="var(--c-agent)" stroke="#ffffff" stroke-width="1.5" opacity="0" pointer-events="none"/>

  function setupGrowthCurve(r) {
    const tel = r.telemetry;
    if (!tel || !Array.isArray(tel.turns_curve) || !tel.turns_curve.length) return;
    const curve = tel.turns_curve;
    const N = curve.length;
    const pStart = curve[0];
    const pLatest = curve[N - 1];
    const growth = (pLatest.prompt_tokens || 0) - (pStart.prompt_tokens || 0);
    const netStr = `${growth >= 0 ? '+' : ''}${fmtTok(growth)}`;
    const maxTok = Math.max(...curve.map((c) => c.prompt_tokens || 0), 100);
    const { yMax } = calculateYScale(maxTok);

    const padL = 46;
    const padR = 14;
    const padT = 18;
    const padB = 26;
    const plotW = 340 - padL - padR;
    const plotH = 150 - padT - padB;
    const plotBottom = padT + plotH;

    const pts = curve.map((turn, i) => {
      const x = N > 1 ? padL + (i / (N - 1)) * plotW : padL + plotW / 2;
      const y = plotBottom - Math.min(plotH, Math.max(0, ((turn.prompt_tokens || 0) / yMax) * plotH));
      return { x, y, turn, i };
    });

    const hitArea = document.getElementById('curve-hit-area');
    const crosshair = document.getElementById('curve-crosshair');
    const hoverDot = document.getElementById('curve-hover-dot');
    const tooltipBar = document.getElementById('curve-tooltip-bar');
    if (!hitArea || !crosshair || !hoverDot || !tooltipBar) return;

    function findClosest(e) {
      const rect = hitArea.getBoundingClientRect();
      const relX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const targetSvgX = padL + relX * plotW;
      let best = pts[0];
      let bestDist = Math.abs(pts[0].x - targetSvgX);
      for (let i = 1; i < pts.length; i++) {
        const dist = Math.abs(pts[i].x - targetSvgX);
        if (dist < bestDist) {
          bestDist = dist;
          best = pts[i];
        }
      }
      return best;
    }

    hitArea.addEventListener('pointermove', (e) => {
      const pt = findClosest(e);
      crosshair.setAttribute('x1', pt.x.toFixed(1));
      crosshair.setAttribute('x2', pt.x.toFixed(1));
      crosshair.style.opacity = '0.75';

      hoverDot.setAttribute('cx', pt.x.toFixed(1));
      hoverDot.setAttribute('cy', pt.y.toFixed(1));
      hoverDot.style.opacity = '1';
      if (pt.turn.cache_bust) {
        hoverDot.setAttribute('fill', '#ef4444');
      } else if (pt.turn.user_prompt) {
        hoverDot.setAttribute('fill', 'var(--c-user)');
      } else if (pt.turn.context_delta < 0) {
        hoverDot.setAttribute('fill', '#81c995');
      } else {
        hoverDot.setAttribute('fill', 'var(--c-agent)');
      }

      const delta = pt.turn.context_delta || 0;
      const deltaStr = (delta >= 0 ? '+' : '') + fmtTok(delta);
      const bustTag = pt.turn.cache_bust ? `<span class="turn-tag bust">${esc(t('tag_bust_long'))}</span>` : '';
      const userTag = pt.turn.user_prompt ? `<span class="turn-tag user">${esc(t('tag_user'))}</span>` : '';
      const toolTag = pt.turn.tool_count > 0 ? `<span class="turn-tag">${esc(t('tag_tools', { n: pt.turn.tool_count }))}</span>` : '';
      const snippet = pt.turn.user_prompt
        ? esc(pt.turn.user_prompt)
        : (pt.turn.tool_summary ? esc(pt.turn.tool_summary) : (pt.turn.timestamp ? esc(pt.turn.timestamp) : ''));

      tooltipBar.innerHTML = `
        <div class="curve-tooltip-main num">
          <strong>#${pt.turn.step}</strong>
          <span>${fmtTok(pt.turn.prompt_tokens)} tok</span>
          <span class="dim">(${deltaStr})</span>
          <span class="dim">${esc(t('tip_hit', { pct: pt.turn.cache_hit_pct }))}</span>
          ${bustTag}
          ${userTag}
          ${toolTag}
          ${snippet ? `<span class="curve-tooltip-preview dim">${snippet}</span>` : ''}
        </div>
      `;
    });

    hitArea.addEventListener('pointerleave', () => {
      crosshair.style.opacity = '0';
      hoverDot.style.opacity = '0';
      tooltipBar.innerHTML = `
        <div class="curve-tooltip-main num">
          <span class="dim">${t('curve_peak_net', { peak: fmtTok(maxTok), net: netStr })}</span>
        </div>
      `;
    });

    hitArea.addEventListener('click', (e) => {
      const pt = findClosest(e);
      selectedTurnStep = pt.turn.step;
      const allTurns = (tel && Array.isArray(tel.recent_turns)) ? tel.recent_turns : [];
      const isBeyondRecent = allTurns.findIndex((tr) => tr.step === pt.turn.step) >= 12;
      if (isBeyondRecent && !showAllTurns) {
        showAllTurns = true;
        render(r, swarmData);
      }
      setTimeout(() => {
        const det = document.querySelector(`details.turn-item[data-step="${pt.turn.step}"]`);
        if (det) {
          det.open = true;
          det.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          det.style.borderColor = 'var(--c-agent)';
          setTimeout(() => { det.style.borderColor = ''; }, 1200);
        }
      }, 50);
    });
  }

    const delta = Number(tr.context_delta) || 0;

    const tools = Array.isArray(tr.tools) ? tr.tools : [];

    return `

          <span class="num">${esc(t('td_meta_delta', { d: deltaStr }))}${tr.trace_id ? ` · ${esc(tr.trace_id.slice(0, 12))}` : ''}</span>
        </div>
        ${bustBanner}
        <div class="td-cards">
          <div class="td-card">
            <div class="td-card-title">${esc(t('td_ctx_title'))}</div>
            <div class="td-bar">
              <div style="width:${cachePct.toFixed(1)}%;background:#f9ab00"></div>
              <div style="width:${freshPct.toFixed(1)}%;background:#4c8df6"></div>
            </div>

            <div class="td-kv"><span class="k">${esc(t('td_fresh_input'))}</span><span class="v">${(tr.input_tokens || 0).toLocaleString()}</span></div>

  function singleCacheStrip(r) {
    const lastTurnAt = r.last_turn_at || r.telemetry?.last_turn_at || '';
    const st = evalTtlState(lastTurnAt, 'single');
    const bustCount = Number(r.cache_bust_count ?? r.telemetry?.cache_bust_count ?? 0) || 0;
    const bustTokens = Number(r.cache_bust_tokens ?? r.telemetry?.cache_bust_tokens ?? 0) || 0;
    const bustCls = bustCount >= 5 ? 'severe' : (bustCount > 0 ? 'has-bust' : '');
    const bustText = bustCount > 0
      ? t('bust_has', { n: bustCount, tok: fmtTok(bustTokens) })
      : t('bust_zero');

    const sm = r.swarm_meta || r.cluster || {};
    const jumpKey = sm.cluster_type === 'subagents' ? 'cluster_jump_sub' : 'cluster_jump_swarm';
    const clusterJump = sm && sm.has_cluster
      ? `<button type="button" class="mini-pill info" id="quick-jump-swarm" style="height:22px;border-radius:999px;padding:0 8px;">${esc(t(jumpKey, { act: sm.active_count, tot: sm.member_count }))}</button>`
      : '';

    let quotaHtml = '';
    if (r.quota && r.quota.remaining_pct != null) {
      const qPct = Math.round(Number(r.quota.remaining_pct));
      let qEta = '';
      if (r.quota.reset_time) {
        const diff = Math.max(0, Math.floor((Date.parse(r.quota.reset_time) - Date.now()) / 1000));
        if (diff > 0) {
          const d = Math.floor(diff / 86400);
          const h = Math.floor((diff % 86400) / 3600);
          const m = Math.floor((diff % 3600) / 60);
          qEta = d >= 1
            ? t('quota_dh', { d, h })
            : (h >= 1 ? t('quota_hm', { h, m: String(m).padStart(2, '0') }) : t('quota_m', { m: Math.max(1, m) }));
        } else {
          qEta = t('quota_soon');
        }
      }
      const qCls = qPct <= 10 ? 'severe' : (qPct <= 25 ? 'has-bust' : '');
      const etaPart = qEta ? ' · ' + qEta : '';
      quotaHtml = `<span class="bust-pill ${qCls} num" title="${esc(t('quota_tip'))}">${esc(t('quota_pill', { pct: qPct, eta: etaPart }))}</span>`;
    }

    return `
      <div class="cache-strip">
        <span class="ttl-pill ${st.cls}" data-ttl-ts="${esc(lastTurnAt)}" data-ttl-mode="single" title="${esc(st.title)}">
          <span class="ttl-dot"></span>
          <span class="ttl-txt">${esc(st.label)}</span>
        </span>
        <span class="bust-pill ${bustCls} num" title="${esc(t('bust_tip'))}">
          ${esc(bustText)}
        </span>
        ${quotaHtml}
        ${clusterJump}
      </div>`;
  }

  function renderWorkerCard(m, auditEnabled) {
    const isKilled = m.state === 'killed';
    const ttlInfo = isKilled ? null : evalTtlState(m.last_turn_at || '', 'worker');
    const ttlHtml = isKilled
      ? `<span class="ttl-pill killed"><span class="ttl-txt">${esc(t('st_killed'))}</span></span>`
      : `<span class="ttl-pill ${ttlInfo.cls}" data-ttl-ts="${esc(m.last_turn_at || '')}" data-ttl-mode="worker" title="${esc(ttlInfo.title)}"><span class="ttl-dot"></span><span class="ttl-txt">${esc(ttlInfo.label)}</span></span>`;

    const audit = m.model_audit || { status: 'ok', label: '' };
    const auditCls = audit.status === 'violation' ? 'bad' : (audit.status === 'warn' ? 'warn' : 'ok');
    const showAuditBadge = Boolean(auditEnabled && audit.label);
    const auditBadgeHtml = showAuditBadge ? `<span class="mini-pill ${auditCls}">${esc(audit.label)}</span>` : '';

    const ctx = Number(m.current_context) || 0;
    const budget = Number(m.request_budget) || Number(m.limit_tokens) || 512000;
    const ctxPct = Math.min(100, Math.max(0, (ctx / budget) * 100));
    const ctxColor = ctxPct >= 78 ? '#ef4444' : (ctxPct >= 58 ? '#f59e0b' : 'var(--c-agent)');
    const heavyWarn = ctxPct >= 78 && !isKilled
      ? `<span class="mini-pill bad" title="${esc(t('wk_high_ctx_tip'))}">${esc(t('wk_high_ctx'))}</span>`
      : '';

    const bustCnt = Number(m.cache_bust_count) || 0;
    const bustTok = Number(m.cache_bust_tokens) || 0;
    const bustSpan = bustCnt > 0
      ? `<span style="color:${bustCnt >= 5 ? '#f87171' : '#f59e0b'};font-weight:600;">${esc(t('wk_bust_has', { n: bustCnt, tok: fmtTok(bustTok) }))}</span>`
      : `<span>${esc(t('wk_bust_zero'))}</span>`;

    return `
      <div class="worker-card ${m.is_viewed ? 'viewed' : ''} ${isKilled ? 'killed' : ''}">
        <div class="wk-top">
          <div class="wk-id">
            <span class="st-dot ${esc(m.state)}" title="${esc(stateLabel(m.state))}"></span>
            <span class="wk-name" title="${esc(m.name)} (${esc(m.conversation_id)})">${esc(m.name)}</span>
            <span class="mini-pill">${esc(roleShortLabel(m))}</span>
            ${m.is_viewed ? `<span class="mini-pill info">${esc(t('wk_viewed'))}</span>` : ''}
            ${heavyWarn}
          </div>
          ${ttlHtml}
        </div>
        <div class="wk-mid">
          <div class="wk-model" title="${esc(t('wk_model_tip', { m: m.model || '', b: m.base_model || '' }))}">
            <span class="wk-model-name">${esc(m.model || 'Unknown')}</span>
            ${auditBadgeHtml}
          </div>
          <span class="num dim" style="font-size:10.5px;">${esc(stateLabel(m.state))}</span>
        </div>
        <div class="ctx-bar-row" title="${esc(t('wk_ctx_tip', { ctx: ctx.toLocaleString(), bud: budget.toLocaleString() }))}">
          <div class="ctx-bar-track">
            <div class="ctx-bar-fill" style="width:${ctxPct.toFixed(1)}%;background:${ctxColor};"></div>
          </div>
          <span class="num" style="font-size:11px;color:${ctx >= 400000 ? '#f87171' : 'var(--fg)'};">${fmtTok(ctx)} <span class="dim">/ ${fmtTok(budget)}</span></span>
        </div>
        <div class="wk-foot">
          <span>${t('wk_foot_stats', { t: m.turns || 0, hit: (m.hit_rate ?? 0).toFixed(1), out: fmtTok(m.total_output || 0) })}</span>
          ${bustSpan}
        </div>
      </div>`;
  }

  function renderSwarmRadarBody(sr) {
    if (!sr || !sr.has_cluster) {
      return `
        <div class="empty" style="margin:32px 8px;">
          <div style="font-weight:600;color:var(--fg);margin-bottom:6px;">${esc(t('swarm_empty_title'))}</div>
          <div style="font-size:12px;margin-bottom:14px;">${esc(t('swarm_empty_desc'))}</div>
          <button type="button" id="load-latest-swarm-btn">${esc(t('swarm_load_latest'))}</button>
        </div>`;
    }

    const s = sr.summary || {};
    const members = Array.isArray(sr.members) ? sr.members : [];
    const auditEnabled = sr.audit_enabled === true;
    const preSteps = s.pre_dispatch_steps;
    const preSec = s.pre_dispatch_seconds;
    const hasPre = preSteps !== null && preSteps !== undefined;
    const preBadge = hasPre
      ? `<span class="mini-pill ${s.slow_dispatch ? 'bad' : 'ok'}" title="${esc(t('swarm_pre_tip'))}">${esc(t('swarm_pre_overhead', { steps: preSteps, dur: fmtOverheadDur(preSec), slow: s.slow_dispatch ? t('swarm_pre_slow') : '' }))}</span>`
      : `<span class="mini-pill">${esc(t('swarm_direct_dispatch'))}</span>`;

    const modelAlertCnt = auditEnabled ? ((Number(s.violation_count) || 0) + (Number(s.warn_count) || 0)) : 0;
    const modelAlertBadge = !auditEnabled
      ? ''
      : (s.violation_count > 0
          ? `<span class="mini-pill bad">${esc(t('swarm_audit_violation', { n: s.violation_count }))}</span>`
          : (s.warn_count > 0
              ? `<span class="mini-pill warn">${esc(t('swarm_audit_warn', { n: s.warn_count }))}</span>`
              : `<span class="mini-pill ok">${esc(t('swarm_audit_ok'))}</span>`));

    const clusterKindLabel = sr.cluster_type === 'subagents' ? t('swarm_kind_sub') : t('swarm_kind_swarm');

    return `
      <div class="swarm-head">
        <div class="swarm-title-wrap">
          <div class="swarm-title">${esc(sr.title || 'Swarm Cluster')}</div>
          <div class="swarm-sub">
            <span class="mini-pill info">${esc(clusterKindLabel)}</span>
            ${sr.is_worker_view ? `<span class="mini-pill warn" title="${esc(t('swarm_worker_view_tip'))}">${esc(t('swarm_worker_view'))}</span>` : ''}
            ${sr.is_historical_fallback ? `<span class="mini-pill warn">${esc(t('swarm_hist_badge'))}</span>` : ''}
            ${modelAlertBadge}
            <span class="num">${esc(t('swarm_scan_ms', { ms: sr.scan_ms ?? '--' }))}</span>
          </div>
        </div>
        ${sr.is_historical_fallback ? `<button type="button" id="exit-history-swarm-btn">${esc(t('swarm_exit_history'))}</button>` : ''}
      </div>

      <div class="swarm-kpi-grid">
        <div class="kpi-card ${s.slow_dispatch ? 'alert' : ''}">
          <div class="kpi-label"><span>${esc(t('kpi_turns'))}</span></div>
          <div class="kpi-val">${(s.total_turns || 0).toLocaleString()} <span class="dim" style="font-size:11.5px;font-weight:400;">${esc(t('kpi_turns_unit'))}</span></div>
          <div class="kpi-foot">${preBadge}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><span>${esc(t('kpi_hit'))}</span></div>
          <div class="kpi-val" style="color:${(s.overall_hit_rate || 0) >= 85 ? '#10b981' : ((s.overall_hit_rate || 0) >= 65 ? 'var(--fg)' : '#f59e0b')}">${(s.overall_hit_rate ?? 0).toFixed(1)}%</div>
          <div class="kpi-foot"><span>${esc(t('kpi_hit_foot', { cr: fmtTok(s.total_cache_read || 0), inp: fmtTok(s.total_input || 0) }))}</span></div>
        </div>
        <div class="kpi-card ${(s.cache_bust_count || 0) > 0 ? 'alert' : ''}">
          <div class="kpi-label"><span>${esc(t('kpi_bust'))}</span></div>
          <div class="kpi-val" style="color:${(s.cache_bust_count || 0) >= 5 ? '#f87171' : ((s.cache_bust_count || 0) > 0 ? '#f59e0b' : 'var(--fg)')}">${esc(t('kpi_bust_val', { n: s.cache_bust_count || 0 }))}</div>
          <div class="kpi-foot"><span>${t('kpi_bust_foot', { tok: fmtTok(s.cache_bust_tokens || 0) })}</span></div>
        </div>
        <div class="kpi-card ${modelAlertCnt > 0 ? 'alert' : ''}">
          <div class="kpi-label"><span>${esc(t('kpi_members'))}</span></div>
          <div class="kpi-val">${s.active_count || 0} <span class="dim" style="font-size:13px;font-weight:400;">/ ${s.member_count || 0}</span></div>
          <div class="kpi-foot"><span>${esc(t('kpi_members_foot', { w: s.working_count || 0, wt: s.waiting_count || 0, k: s.killed_count || 0 }))}</span></div>
        </div>
      </div>

      <div class="ttl-legend-bar" title="${esc(t('ttl_bar_tip'))}">
        <span class="ttl-leg-item"><span class="ttl-leg-dot" style="background:#10b981"></span><span>${esc(t('ttl_leg_warm'))}</span></span>
        <span class="ttl-leg-item"><span class="ttl-leg-dot" style="background:#f59e0b"></span><span>${esc(t('ttl_leg_risk'))}</span></span>
        <span class="ttl-leg-item"><span class="ttl-leg-dot" style="background:#f87171"></span><span>${esc(t('ttl_leg_cold'))}</span></span>
      </div>

      <section style="margin-top:8px;padding-top:8px;">
        <h2>
          <span>${esc(t(auditEnabled ? 'sec_workers_audit' : 'sec_workers_plain'))}</span>
          <span class="hint num">${esc(t('workers_hint', { n: members.length, out: fmtTok(s.total_output || 0) }))}</span>
        </h2>
        <div class="worker-list">
          ${members.map((m) => renderWorkerCard(m, auditEnabled)).join('')}
        </div>
      </section>`;
  }

  function bindModeTabEvents() {
    document.querySelectorAll('[data-switch-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-switch-mode');
        if (next === 'single') historicalSwarmMode = false;
        setMode(next, true);
      });
    });
    const langBtn = document.getElementById('lang-toggle-btn');
    if (langBtn) {
      langBtn.addEventListener('click', () => { void toggleUiLanguage(); });
    }
    const refreshBtn = document.getElementById('manual-refresh-btn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        lastJson = '';
        void refresh(true);
      });
    }
    const jumpBtn = document.getElementById('quick-jump-swarm');
    if (jumpBtn) {
      jumpBtn.addEventListener('click', () => setMode('swarm', true));
    }
    const histBtn = document.getElementById('load-latest-swarm-btn');
    if (histBtn) {
      histBtn.addEventListener('click', () => {
        historicalSwarmMode = true;
        lastJson = '';
        void refresh(true);
      });
    }
    const exitHistBtn = document.getElementById('exit-history-swarm-btn');
    if (exitHistBtn) {
      exitHistBtn.addEventListener('click', () => {
        historicalSwarmMode = false;
        lastJson = '';
        void refresh(true);
      });
    }
  }

  function formatErrorMessage(r) {
    if (!r || r.error === 'no-conversation') return t('err_no_conv');
    if (r.error === 'no-database') return t('err_no_db');
    return t('err_read_fail', { msg: r.message || r.error });
  }

  function render(r, sr) {
    syncDocumentLangMeta();
    const scrollY = window.scrollY;
    const updatedTime = new Date((sr && activeMode === 'swarm' ? sr.updatedAt : r?.updatedAt) || Date.now())
      .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const updatedFooter = esc(t('footer_updated', { t: updatedTime }));

    if (activeMode === 'swarm') {
      main.innerHTML = `
        ${modeTabsBar(r, sr)}
        ${renderSwarmRadarBody(sr)}
        <footer><span>${esc(t('footer_swarm'))}</span><span>${updatedFooter}</span></footer>`;
      bindModeTabEvents();
      tickAllTtlCapsules();
      if (scrollY > 0) window.scrollTo(0, scrollY);
      return;
    }

    if (!r || r.error) {
      main.innerHTML = `${modeTabsBar(null, sr)}<p class="empty">${esc(formatErrorMessage(r))}</p>`;
      bindModeTabEvents();
      return;
    }

    const nativeLimit = Number(r.limit_tokens) || 0;
    const limit = effectiveLimit(r);
    const used = Number(r.used_tokens) || 0;
    const effPct = limit > 0 ? Math.min(100, (used / limit) * 100) : (r.used_pct || 0);
    const physNote = nativeLimit > limit
      ? `<span class="dim" style="font-size:11.5px;margin-left:4px;" title="${esc(t('phys_tip'))}">${esc(t('phys_note', { lim: fmtTok(nativeLimit) }))}</span>`
      : '';
    const cid = r.conversation_id || initialConversationId;
    main.innerHTML = `
      ${modeTabsBar(r, sr)}
      <div class="top">
        <div class="model"><span class="live on" title="${esc(t('live_tip'))}"></span>${esc(r.model)}</div>
        <button id="copy" title="${esc(t('copy_tip'))}">${esc(t('copy_report'))}</button>
      </div>
      <div class="usage">
        <span class="big num">${fmtTok(r.used_tokens)}</span>
        <span class="of">/ ${limit ? fmtTok(limit) : esc(t('unknown'))} tokens${physNote}</span>
        ${limit ? `<span class="pct num">${effPct.toFixed(1)}%</span>` : ''}
      </div>
      ${singleCacheStrip(r)}
      ${grid(r)}
      ${categories(r)}
      ${growthCurveSection(r)}
      ${telemetrySection(r)}
      ${turnsSection(r)}
      ${checkpoints(r)}
      ${files(t('files_knowledge'), '/rules', r.knowledge_files, cid)}
      ${files(t('files_artifact'), '/artifact', r.artifact_files, cid)}
      ${files(t('files_skill'), '/skill', r.skill_files, cid)}
      ${files(t('files_system'), t('files_autoload'), r.system_files, cid)}
      <footer><span>${esc(t('footer_single'))}</span><span>${updatedFooter}</span></footer>`;

    bindModeTabEvents();
    document.getElementById('copy').addEventListener('click', copy);
    setupGrowthCurve(r);
    tickAllTtlCapsules();

    const toggleBtn = document.getElementById('toggle-turns-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        showAllTurns = !showAllTurns;
        render(r, sr);
      });
    }

    document.querySelectorAll('details.turn-item').forEach((det) => {
      det.addEventListener('toggle', () => {
        const step = Number(det.dataset.step);
        if (det.open) {
          selectedTurnStep = step;
        } else if (selectedTurnStep === step) {
          selectedTurnStep = null;
        }
      });
    });

    if (scrollY > 0) {
      window.scrollTo(0, scrollY);
    }
  }

  function showErrorState(dataObj) {
    report = null;
    lastReportPayload = dataObj;
    lastJson = '';
    syncDocumentLangMeta();
    main.innerHTML = `${modeTabsBar(null, swarmData)}<p class="empty">${esc(formatErrorMessage(dataObj))}</p>`;
    bindModeTabEvents();
  }

  async function copy(event) {
    if (!report) return;
    try {
      await navigator.clipboard.writeText(report.text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = report.text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const btn = event.currentTarget;
    btn.textContent = t('copied');
    setTimeout(() => { btn.textContent = t('copy_report'); }, 1500);
  }

  async function refresh(force = false) {
    if (!force && document.hidden && (report !== null || swarmData !== null)) return;
    try {
      const preUiLang = resolveUiLang();
      const qs = new URLSearchParams({ conversationId: initialConversationId, workspace, lang: preUiLang });
      const res = await doFetch(`/api/report?${qs}`);
      const data = await res.json();

      if (data && data.lang && Date.now() >= userOverrodeLangUntil) {
        configLang = normalizeLangSetting(data.lang);
      }

      const uiLang = resolveUiLang();
      const hasClusterHint = Boolean(data && !data.error && (data.swarm_meta?.has_cluster || data.cluster?.has_cluster));

      if (
        !userPinnedMode &&
        hasClusterHint &&
        (data.swarm_meta || data.cluster)?.cluster_type === 'swarm' &&
        !(data.swarm_meta || data.cluster)?.is_worker_view &&
        Number((data.swarm_meta || data.cluster)?.working_count) > 0
      ) {
        activeMode = 'swarm';
      }

      let nextSwarm = null;
      if (activeMode === 'swarm' || hasClusterHint) {
        const sqs = new URLSearchParams({
          conversationId: (!data.error && data.conversation_id) ? data.conversation_id : initialConversationId,
          latestFallback: (activeMode === 'swarm' && historicalSwarmMode) ? '1' : '0',
          lang: uiLang
        });
        const sRes = await doFetch(`/api/swarm?${sqs}`);
        nextSwarm = await sRes.json();
        if (nextSwarm && nextSwarm.config_lang && Date.now() >= userOverrodeLangUntil) {
          configLang = normalizeLangSetting(nextSwarm.config_lang);
        }
        if (nextSwarm && nextSwarm.has_cluster && !nextSwarm.is_historical_fallback) {
          historicalSwarmMode = false;
        }
      }

      lastReportPayload = data;
      if (activeMode === 'single' && data.error) {
        swarmData = nextSwarm;
        return showErrorState(data);
      }

      const cleanRep = data ? { ...data, updatedAt: '' } : null;
      const cleanSwarm = nextSwarm ? { ...nextSwarm, updatedAt: '', scan_ms: 0 } : null;
      const sig = JSON.stringify({ lang: resolveUiLang(), mode: activeMode, rep: cleanRep, sw: cleanSwarm });
      if (!force && sig === lastJson) return;
      lastJson = sig;
      report = data && !data.error ? data : null;
      swarmData = nextSwarm;
      render(data, nextSwarm);
    } catch {
      const dot = document.querySelector('.live');
      if (dot) dot.classList.remove('on');
    }
  }

  document.addEventListener('visibilitychange', () => refresh(false));

  function start() {
    syncDocumentLangMeta();
    main.innerHTML = `<p class="empty">${esc(t('loading'))}</p>`;
    try {
      window.parent?.postMessage({ type: 'agy-context-query-host-lang' }, '*');
    } catch {}
    doFetch('/api/config')
      .then((r) => r.json())
      .then((res) => {
        if (res && res.lang && Date.now() >= userOverrodeLangUntil) {
          configLang = normalizeLangSetting(res.lang);
          syncDocumentLangMeta();
        }
      })
      .catch(() => {})
      .finally(() => {
        refresh(true);
      });
    setInterval(() => refresh(false), POLL_MS);
    setInterval(tickAllTtlCapsules, 1000);
    if (window.sidecar && window.sidecar.getWorkspaceUris) {
      window.sidecar.getWorkspaceUris().then((uris) => {
        if (Array.isArray(uris) && (uris[0] || '') !== workspace) {
          workspace = uris[0] || '';
          lastJson = '';
          refresh(true);
        }
      }).catch(() => {});
      if (window.sidecar.onWorkspaceChange) {
        window.sidecar.onWorkspaceChange((next) => {
          if (Array.isArray(next) && (next[0] || '') !== workspace) {
            workspace = next[0] || '';
            lastJson = '';
            refresh(true);
          }
        });
      }
    }
  }
  start();
})();
</script>
</body>
</html>
